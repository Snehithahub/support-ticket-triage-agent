[project]
name = "triagedesk"
version = "0.1.0"
description = "Support ticket triage agent: classify, retrieve help docs, draft cited replies, route for human review."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Snehitha Telkapally" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgvector>=0.3,<0.5",
    "numpy>=1.26,<3",
    "langgraph>=0.2.60,<2",
    "fastembed>=0.4,<0.8",
    "pyyaml>=6.0,<7",
    "langdetect>=1.0.9,<2",
    "rapidfuzz>=3.9,<4",
    "markdown>=3.6,<4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38,<2", "pandas>=2.2,<3"]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "testcontainers[postgres]>=4.8,<5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagedesk"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "SIM108", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a real PostgreSQL+pgvector (TEST_DATABASE_URL or Docker via testcontainers)",
]
addopts = "-ra"
