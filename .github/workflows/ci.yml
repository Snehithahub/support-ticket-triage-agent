name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triagedesk
          POSTGRES_PASSWORD: triagedesk
          POSTGRES_DB: triagedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triagedesk -d triagedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Integration tests use this service instead of starting a testcontainer.
      TEST_DATABASE_URL: postgresql://triagedesk:triagedesk@localhost:5432/triagedesk
      DATABASE_URL: postgresql://triagedesk:triagedesk@localhost:5432/triagedesk
      # Offline: scripted/fake LLM and hash embeddings. No API keys in CI.
      LLM_PROVIDER: fake
      EMBEDDINGS_PROVIDER: hash
      LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  n8n-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workflow JSON (structure, node types, disabled notifiers)
        run: python n8n/validate.py n8n/workflows/triage.json

      - name: Import and publish into the pinned n8n image
        run: |
          image=$(sed -n 's/^ *image: *\(n8nio\/n8n:[^ ]*\).*/\1/p' docker-compose.n8n.yml | head -1)
          echo "using $image"
          docker run --rm -e N8N_ENCRYPTION_KEY=ci-only-key \
            -v "$PWD/n8n:/workflows:ro" --entrypoint /bin/sh "$image" /workflows/import.sh
